          '<button class="iconbtn" onclick="openShare()" aria-label="共有">' + ICONS.share + '</button>' +
        '</div>' +
        '<div class="container">' +
          '<div class="card" style="background:linear-gradient(135deg, oklch(30% 0.09 22), oklch(15% 0.03 30));border:1px solid oklch(55% 0.09 82 / 0.5);box-shadow:0 8px 22px oklch(0% 0 0 / 0.5), inset 0 1px 0 oklch(100% 0 0 / 0.06)">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px">' +
              '<div style="display:flex;flex-direction:column;gap:2px">' +
                '<span style="color:oklch(85% 0.03 70 / 0.85);font-size:13px">合計金額</span>' +
                '<span class="num" style="color:var(--gold);font-weight:900;font-size:25px;text-shadow:0 0 14px oklch(80% 0.12 84 / 0.5)">' + yen(total) + '</span>' +
              '</div>' +
              '<span style="color:oklch(85% 0.03 70 / 0.85);font-size:13.5px">' + state.m.length + '人・' + state.p.length + '件</span>' +
            '</div>' +
          '</div>' +
          renderHint() +
          '<div style="display:flex;flex-direction:column;gap:10px">' +
            '<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px">メンバー（' + state.m.length + '人）</h3></div>' +
            '<div class="chips">' + state.m.map(renderMemberChip).join('') + '</div>' +
            '<div class="addmember-row">' +
              '<input id="new-member-name" class="input" maxlength="20" placeholder="名前を入力して追加">' +
              '<button type="button" class="btn btn-primary btn-sm" onclick="addMember()">' + ICONS.plus + '追加</button>' +
            '</div>' +
            (ui.memberError ? '<div class="err-text">' + esc(ui.memberError) + '</div>' : '') +
          '</div>' +
          '<div class="tabbar">' +
            '<button class="tab' + (ui.tab === 'pay' ? ' active' : '') + '" onclick="switchTab(\'pay\')">支払い</button>' +
            '<button class="tab' + (ui.tab === 'settle' ? ' active' : '') + '" onclick="switchTab(\'settle\')">精算結果</button>' +
          '</div>' +
          body +
        '</div>' +
        (ui.tab === 'pay' ? renderAddPaymentBottom() : '') +
      '</div>' +
      (ui.addOpen ? renderAddPaymentSheet() : '') +
      (ui.shareOpen ? renderShareSheet() : '') +
      (ui.fgOpen ? renderFinalGachaSheet() : '');
  }

  function renderHint() {
    if (ui._hintDismissed) return '';
    return '<div class="hint" id="event-hint">' + ICONS.info +
      '<span>お支払いを記録されるたびに、清算は自動で算出されます。内容を変更された際は、新しい証文を皆様にお配りいただきますようお願いいたします。</span>' +
      '<button class="hint-close" onclick="dismissHint()" aria-label="閉じる">' + ICONS.close + '</button>' +
    '</div>';
  }

  function renderMemberChip(m) {
    var locked = isMemberPayer(state, m.i);
    var removeBtn = locked
      ? '<span class="icon-disabled" title="支払いを記録しているため削除できません" style="margin-top:-14px;margin-left:28px;display:inline-flex">' + ICONS.lock + '</span>'
      : '<button type="button" class="chip-remove" onclick="removeMember(' + m.i + ')" aria-label="削除">' + ICONS.close + '</button>';
    return '<div class="chip-member">' + avatarHtml(m.i, m.a, 46) + removeBtn + '<span class="name">' + esc(m.a) + '</span></div>';
  }

  function renderPayTab() {
    if (!state.p.length) {
      return '<div class="empty">' + ICONS.receipt + '<span>まだ何も記録されておりません。<br>下の「支払いを追加」より、最初の一筆をどうぞ。</span></div>';
    }
    var items = state.p.slice().reverse().map(function (p) {
      var payer = memberName(state, p.y);
      var sub = '<span class="who">' + esc(payer) + '</span>が支払い ・ ' + p.s.length + '人で割り勘';
      return '<div class="card-flat paycard">' +
        avatarHtml(p.y, payer, 38) +
        '<div class="meta"><span class="label">' + esc(p.l) + '</span><span class="sub">' + sub + '</span></div>' +
        '<span class="num amt">' + yen(p.a) + '</span>' +
        '<button class="icon-edit" onclick="openEditPayment(' + p.i + ')" aria-label="編集">' + ICONS.edit + '</button>' +
        '<button class="icon-danger" onclick="removePayment(' + p.i + ')" aria-label="削除">' + ICONS.trash + '</button>' +
      '</div>';
    }).join('');
    return '<div class="rows">' + items + '</div>';
  }

  function renderSettleTab() {
    if (!state.p.length) {
      return '<div class="empty">' + ICONS.scale + '<span>お支払いが記録されますと、こちらに清算の結末が浮かび上がって参ります。</span></div>';
    }
    var res = computeSettlement(state);
    var balances = state.m.map(function (m) {
      var n = res.net[m.i] || 0;
      var cls = n > 0 ? 'pos' : (n < 0 ? 'neg' : 'zero');
      var text = n > 0 ? '+' + yen(n) + ' 受け取り' : (n < 0 ? '-' + yen(-n) + ' 支払い' : '精算済み');
      return '<div class="balance-row">' + avatarHtml(m.i, m.a, 30) + '<span class="name">' + esc(m.a) + '</span><span class="num balance-amt ' + cls + '">' + text + '</span></div>';
    }).join('');

    var body;
    if (!res.transfers.length) {
      body = '<div class="empty" style="padding:22px 14px">' + ICONS.check + '<span>貸し借りはすべて清算済みでございます。もう送金の必要はございません。</span></div>';
    } else {
      var count = res.transfers.length;
      var list = res.transfers.map(function (t) {
        var done = state.d.indexOf(t.key) !== -1;
        return '<div class="card-flat transfer-card">' +
          '<div class="transfer-top">' +
            avatarHtml(t.from, memberName(state, t.from), 30) + '<span class="transfer-name">' + esc(memberName(state, t.from)) + '</span>' +
            '<span style="color:var(--text-tertiary);display:flex">' + ICONS.arrow + '</span>' +
            avatarHtml(t.to, memberName(state, t.to), 30) + '<span class="transfer-name">' + esc(memberName(state, t.to)) + '</span>' +
            '<span class="num transfer-amt">' + yen(t.amount) + '</span>' +
          '</div>' +
          '<button class="done-btn' + (done ? ' is-done' : '') + '" onclick="toggleDone(\'' + t.key + '\')">' + (done ? ICONS.check + '送金済み' : '送金済みにする') + '</button>' +
        '</div>';
      }).join('');
      body = '<div style="display:flex;justify-content:space-between;align-items:center">' +
          '<h3 style="font-size:15px">送金リスト</h3><span class="badge badge-success">' + count + '件で精算</span>' +
        '</div><div class="rows" style="margin-top:10px">' + list + '</div>';
    }

    return '<div style="display:flex;flex-direction:column;gap:16px">' +
      '<div class="card-flat" style="display:flex;flex-direction:column;gap:8px">' + balances + '</div>' +
      renderFinalGachaCard() +
      '<div>' + body + '</div>' +
    '</div>';
  }

  function drawsLeft() { return Math.max(0, FG_MAX_DRAWS - (state.g || 0)); }

  function renderFinalGachaCard() {
    if (state.m.length < 2) return '';
    if (state.fg && state.m.some(function (m) { return m.i === state.fg.loser; })) {
      var fgAmt = fgAmount(state);
      var lucky = fgAmt < 0;
      var pctNote = state.fg.percent ? '（合計の' + Math.abs(state.fg.percent) + '%）' : '';
      return '<div class="fg-card">' +
        '<div class="fg-head">' + ICONS.dice + '<h3>最終ガチャ結果</h3></div>' +
        '<div class="fg-result-row">' + avatarHtml(state.fg.loser, memberName(state, state.fg.loser), 34) +
          '<span class="name">' + esc(memberName(state, state.fg.loser)) + (lucky
            ? '様が一発逆転！' + yen(Math.abs(fgAmt)) + pctNote + 'を受け取り、ほかの皆様がお支払いすることと相成りました。'
            : '様が' + yen(fgAmt) + pctNote + 'を奢ることと相成りました。') + '</span>' +
        '</div>' +
        (drawsLeft() > 0 ? '' : '<p class="lede" style="font-size:12.5px;text-align:center;margin:0">引き直しは使い切りました。</p>') +
        '<div class="fg-links">' +
          (drawsLeft() > 0 ? '<button type="button" class="btn-text" onclick="redoFinalGachaFromCard()">' + ICONS.dice + '引き直す（あと' + drawsLeft() + '回）</button>' : '') +
          '<button type="button" class="btn-text" onclick="removeFinalGacha()">取り消す</button>' +
        '</div>' +
      '</div>';
    }
    if (drawsLeft() === 0) {
      return '<div class="fg-card"><div class="fg-head">' + ICONS.dice + '<h3>最終ガチャ</h3></div>' +
        '<p class="lede" style="font-size:13px;margin:0">このイベントの最終ガチャは、すでに使い切りました。</p></div>';
    }
    return '<div class="fg-card">' +
      '<div class="fg-head">' + ICONS.dice + '<h3>最後に、運命をお試しになりますか？</h3></div>' +
      '<p class="lede" style="font-size:13.5px">運命が二度巡ります。まずは奢っていただく方、続いて罰金の割合——マイナスが出れば、一発逆転もございます。</p>' +
      '<button type="button" class="btn btn-secondary btn-block" onclick="openFinalGacha()">最終ガチャを引く</button>' +
    '</div>';
  }

  // The close button is offered only while nothing has been decided (setup, settings, and the
  // gachapon before the lever is pulled). Once a member is picked the draw has to be carried
  // through — closing and reopening would be a free redraw.
  function fgCloseButton() {
    var open = ui.fgStage === 'setup' || ui.fgStage === 'settings' ||
      (ui.fgStage === 'loserMachine' && ui.machine && ui.machine.phase === 'idle');
    return open ? '<button class="iconbtn" onclick="closeFinalGacha()" aria-label="閉じる">' + ICONS.close + '</button>' : '';
  }

  function renderFinalGachaSheet() {
    var inner = ui.fgStage === 'loserMachine' ? renderGachaMachineStage('最終ガチャ')
      : ui.fgStage === 'loserResult' ? renderFgLoserResult()
      : ui.fgStage === 'percentRoulette' ? renderPercentRouletteStage()
      : ui.fgStage === 'result' ? renderFinalGachaResult()
      : ui.fgStage === 'settings' ? renderRouletteSettings()
      : renderFinalGachaSetup();
    var allowBackdrop = ui.fgStage === 'setup';
    return '<div class="overlay" onclick="if(event.target===this && ' + allowBackdrop + ')closeFinalGacha()">' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="最終ガチャ">' + inner + '</div>' +
    '</div>';
  }

  function renderFinalGachaSetup() {
    var percents = fgRoulette().map(function (r) { return r.percent; });
    return '' +
      '<div class="sheet-head"><h2>最終ガチャ</h2>' + fgCloseButton() + '</div>' +
      '<p class="lede" style="font-size:13.5px">まずは全' + state.m.length + '名様の中から、ガチャでお一人（対象者）が選ばれます。続いてルーレットが、罰金の割合（' + percents.join('%・') + '%のいずれか）を合計金額の中からお選びいたします。対象者は、その金額を皆様に奢ることになります。</p>' +
      '<p class="lede" style="font-size:13.5px">ただし、マイナスが出れば一発逆転——対象者が金額を受け取り、対象者以外の皆様で割り勘してお支払いいたします。</p>' +
      '<p class="lede" style="font-size:12.5px">※ガチャのレバーを引いたあとは、結果が出るまで途中で閉じられません。引き直しは、結果を反映したあとに1回だけ可能です。</p>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="startFinalGachaMachine()">' + ICONS.dice + 'ガチャを回す</button>' +
      '<div class="row" style="justify-content:center"><button type="button" class="btn-text" onclick="openRouletteSettings()">ルーレットの％を設定する</button></div>';
  }

  function renderRouletteSettings() {
    var draft = ui.fgDraft || [];
    var chances = rouletteChanceTexts(draft.map(function (d) { return d.w; }));
    var rows = draft.map(function (d, i) {
      return '<div class="rs-grid rs-row">' +
        '<input class="input rs-percent" type="number" min="-100" max="100" step="1" value="' + esc(d.p) + '" aria-label="罰金の割合（%）">' +
        '<input class="input rs-weight" type="number" inputmode="numeric" min="1" max="100" step="1" value="' + esc(d.w) + '" aria-label="出やすさ" oninput="updateRouletteChances()">' +
        '<span class="num rs-chance">' + chances[i] + '</span>' +
        '<button type="button" class="chip-remove" style="margin:0;width:30px;height:30px" onclick="removeRouletteRow(' + i + ')" aria-label="この項目を削除">' + ICONS.close + '</button>' +
      '</div>';
    }).join('');
    return '' +
      '<div class="sheet-head"><h2>ルーレットの設定</h2>' + fgCloseButton() + '</div>' +
      '<p class="lede" style="font-size:13.5px">ルーレットに載せる罰金の割合（%）と、その出やすさを決められます。出やすさは数字が大きいほど出やすくなります（1〜100）。このイベントを共有した皆様にも、同じ設定が引き継がれます。</p>' +
      '<p class="lede" style="font-size:13.5px">割合をマイナス（例：-20）にすると「一発逆転」になります。対象者がその金額を受け取り、対象者以外の皆様で割り勘してお支払いします。</p>' +
      '<div class="rows">' +
        '<div class="rs-grid rs-head"><span>罰金の割合（%）</span><span>出やすさ</span><span>出る確率</span><span></span></div>' +
        rows +
      '</div>' +
      '<div class="err-text" id="rs-err"></div>' +
      '<div class="row" style="justify-content:space-between">' +
        '<button type="button" class="btn-text" onclick="addRouletteRow()">' + ICONS.plus + '項目を追加</button>' +
        '<button type="button" class="btn-text" onclick="resetRouletteDraft()">初期値に戻す</button>' +
      '</div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="saveRouletteSettings()">この設定で保存する</button>' +
      '<div class="row" style="justify-content:center"><button type="button" class="btn-text" onclick="cancelRouletteSettings()">戻る</button></div>';
  }

  function renderFgLoserResult() {
    var name = esc(memberName(state, ui.fgWinner));
    return '' +
      '<div class="sheet-head"><h2>最終ガチャ</h2>' + fgCloseButton() + '</div>' +
      '<div class="gm-wrap"><div class="gm-slot" style="width:88px;height:88px;border-radius:50%;margin:0 auto;background:none;box-shadow:none;border:none">' + avatarHtml(ui.fgWinner, memberName(state, ui.fgWinner), 76) + '</div></div>' +
      '<div class="gacha-percent-banner"><span class="headline">対象者は【' + name + '】様に決定いたしました。</span><span class="sub">続いて、ルーレットで罰金の割合を決めます。マイナスが出れば、一発逆転の目もございます。</span></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="proceedToPercentRoulette()">次へ：罰金の割合を決める</button>';
  }

  function renderPercentRouletteStage() {
    return '' +
      '<div class="sheet-head"><h2>最終ガチャ</h2>' + fgCloseButton() + '</div>' +
      '<div class="gacha-summary"><span class="label">罰金の割合を決定（対象：' + esc(memberName(state, ui.fgWinner)) + '様）</span><span class="num amt">合計 ' + yen(totalSpent(state)) + '</span></div>' +
      renderRouletteWheel(0, true) +
      '<div class="gacha-stage-text">ルーレットが回っております…</div>' +
      '<button type="button" id="rw-stop-btn" class="btn btn-primary btn-block" onclick="stopRoulette()">ストップ</button>';
  }

  function renderFinalGachaResult() {
    var winner = ui.fgWinner;
    var amount = penaltyAmount(totalSpent(state), ui.fgPercent);   // signed
    var lucky = amount < 0;
    var mag = Math.abs(amount);
    var pct = Math.abs(ui.fgPercent);
    var ids = state.m.map(function (m) { return m.i; });
    var others = ids.filter(function (id) { return id !== winner; });
    var split = splitByWeight(mag, others.map(function () { return 1; }));
    var name = esc(memberName(state, winner));
    var breakdown = '<div class="row2"><span class="nm">' + name + (lucky ? '（一発逆転・受け取り）' : '（罰金）') + '</span><span class="num sh">' + (lucky ? '+' : '-') + yen(mag) + '</span></div>' +
      others.map(function (id, idx) {
        return '<div class="row2"><span class="nm">' + esc(memberName(state, id)) + '</span><span class="num sh">' + (lucky ? '-' : '+') + yen(split[idx]) + '</span></div>';
      }).join('');
    var banner = lucky
      ? '<div class="gacha-result-banner is-lucky"><span class="headline">一発逆転！' + name + '様が、合計の' + pct + '%（' + yen(mag) + '）を受け取り、ほかの皆様がお支払いすることと相成りました。</span><span class="roast">' + esc(ui.fgRoast || '') + '</span></div>'
      : '<div class="gacha-result-banner"><span class="headline">誠に残念ながら、' + name + '様が、合計の' + pct + '%（' + yen(mag) + '）を奢ることと相成りました。</span><span class="roast">' + esc(ui.fgRoast || '') + '</span></div>';
    return '' +
      '<div class="sheet-head"><h2>最終ガチャ結果</h2>' + fgCloseButton() + '</div>' +
      renderRouletteWheel(ui.roulette ? ui.roulette.finalAngle : 0, false) +
      banner +
      '<div class="gacha-breakdown">' + breakdown + '</div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="confirmFinalGacha()">この結果を反映する</button>' +
      '<p class="lede" style="font-size:13px;text-align:center">結果は覚悟してお受けくださいませ。引き直しは、反映したあとに1回だけ可能です。</p>';
  }

  function renderAddPaymentBottom() {
    return '<div class="sticky-bottom"><button type="button" class="btn btn-primary btn-block" onclick="openAddPayment()">' + ICONS.plus + '支払いを追加</button></div>';
  }

  function renderAddPaymentSheet() {
    return '<div class="overlay" onclick="if(event.target===this)closeAddPayment()">' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="支払い">' + renderPaymentForm() + '</div>' +
    '</div>';
  }

  function renderPaymentForm() {
    var ep = ui.editPaymentId !== null ? state.p.find(function (p) { return p.i === ui.editPaymentId; }) : null;
    var payerOptions = state.m.map(function (m) {
      return '<option value="' + m.i + '"' + (ep && ep.y === m.i ? ' selected' : '') + '>' + esc(m.a) + '</option>';
    }).join('');
    var checks = state.m.map(function (m) {
      var on = ep ? ep.s.indexOf(m.i) !== -1 : true;
      return '<label class="row" style="gap:8px;font-size:15px">' +
        '<input type="checkbox" class="pay-participant" value="' + m.i + '"' + (on ? ' checked' : '') + ' style="width:19px;height:19px">' +
        avatarHtml(m.i, m.a, 26) + '<span>' + esc(m.a) + '</span></label>';
    }).join('');
    return '' +
      '<div class="sheet-head"><h2>' + (ep ? '支払いを編集' : '支払いを追加') + '</h2><button class="iconbtn" onclick="closeAddPayment()" aria-label="閉じる">' + ICONS.close + '</button></div>' +
      '<div class="field"><label for="pay-payer">支払った人</label><select id="pay-payer" class="input">' + payerOptions + '</select></div>' +
      '<div class="field"><label for="pay-label">内容</label><input id="pay-label" class="input" maxlength="30" placeholder="例：ホテル代" value="' + (ep ? esc(ep.l) : '') + '"></div>' +
      '<div class="field"><label for="pay-amount">金額</label><input id="pay-amount" class="input" type="number" inputmode="numeric" min="1" placeholder="0" value="' + (ep ? ep.a : '') + '"></div>' +
      '<div class="field"><label>対象者</label><div class="rows">' + checks + '</div></div>' +
      '<div id="pay-err" class="err-text"></div>' +
      '<button type="button" class="btn btn-primary btn-block" onclick="submitPayment()">' + (ep ? '保存する' : '追加する') + '</button>';
  }

  // The gachapon machine visual itself: dome full of capsules, a crank, and a drop
  // slot. Reads ui.machine (set by openAddPayment's gacha path or the final-gacha
  // flow) and re-renders as pullLever() advances ui.machine.phase over time.
  function renderGachaMachine() {
    var m = ui.machine;
    var n = m.participants.length;
    var capSize = n <= 4 ? 44 : (n <= 6 ? 38 : 32);
    var domeEmpty = m.phase === 'dropping' || m.phase === 'cracking';
    var domeCapsules = m.participants.map(function (val, idx) {
      var hue = hueForId(val);
      var label = esc(initial(memberName(state, val)));
      return '<div class="gm-capsule' + (domeEmpty ? ' gm-capsule-gone' : '') +
        '" style="width:' + capSize + 'px;height:' + capSize + 'px;font-size:' + Math.round(capSize * 0.4) +
        'px;background:radial-gradient(circle at 35% 30%, oklch(88% 0.09 ' + hue + '), oklch(76% 0.13 ' + hue + ') 65%, oklch(66% 0.14 ' + hue + ') 100%);animation-delay:' + (idx * 0.13) + 's">' +
        label + '</div>';
    }).join('');
    var dropEl = '';
    if (m.phase === 'dropping' || m.phase === 'cracking') {
      var whue = hueForId(m.winner);
      var reveal = avatarHtml(m.winner, memberName(state, m.winner), 44);
      dropEl = '<div class="gm-capsule-drop' + (m.phase === 'cracking' ? ' cracking' : '') + '">' +
        '<div class="gm-shell-top" style="background:oklch(94% 0.03 ' + whue + ')"></div>' +
        '<div class="gm-shell-bottom" style="background:oklch(76% 0.13 ' + whue + ')"></div>' +
        '<div class="gm-avatar-reveal">' + reveal + '</div>' +
      '</div>';
    }
    var statusText = m.phase === 'idle' ? '運命のレバーを、お引きください。'
      : m.phase === 'shaking' ? 'ガチャガチャガチャ…'
      : m.phase === 'dropping' ? 'コロン…'
      : 'パカッ！';
    return '' +
      '<div class="gm-wrap">' +
        '<div class="gm-machine">' +
          '<div class="gm-dome' + (m.phase === 'shaking' ? ' shaking' : '') + '">' + domeCapsules + '</div>' +
          '<div class="gm-body">' +
            '<button type="button" class="gm-crank' + (m.phase === 'shaking' ? ' spinning' : '') + '" onclick="pullLever()" aria-label="レバーを回す"' + (m.phase !== 'idle' ? ' disabled' : '') + '><span class="gm-crank-knob"></span></button>' +
            '<div class="gm-slot">' + dropEl + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="gacha-stage-text">' + statusText + '</div>' +
        (m.phase === 'idle' ? '<button type="button" class="btn btn-secondary btn-lever-cta" onclick="pullLever()">' + ICONS.dice + '運命のレバーをお引きください</button>' : '') +
      '</div>';
  }

  function renderGachaMachineStage(title) {
    var summary = '<div class="gacha-summary"><span class="label">対象者を決定（' + ui.machine.participants.length + '人の中から）</span><span class="num amt">合計 ' + yen(totalSpent(state)) + '</span></div>';
    return '' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2>' +
      fgCloseButton() +
      '</div>' +
      summary +
      renderGachaMachine();
  }

  function renderShareSheet() {
    var url = shareUrl();
    // Long events (roughly 30+ payments) overflow a QR code. Try the usual error-correction
    // level first, then the lower one, which holds more; if neither fits, say so.
    var qr = '';
    var qc = null;
    ['M', 'L'].some(function (level) {
      try {
        var t = qrcode(0, level);
        t.addData(url);
        t.make();
        qc = t;
        return true;
      } catch (e) { return false; }
    });
    qr = qc
      ? qc.createSvgTag({ cellSize: 4, margin: 2, scalable: true })
      : '<span style="font-size:14px;line-height:1.7;color:#900;text-align:center">記録が多くなり、QRコードにできなくなりました。下の「コピー」でリンクを取り、メッセージなどでお渡しください。</span>';
    return '<div class="overlay" onclick="if(event.target===this)closeShare()">' +
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="メンバーを招待">' +
        '<div class="sheet-head"><h2>メンバーを招待</h2><button class="iconbtn" onclick="closeShare()" aria-label="閉じる">' + ICONS.close + '</button></div>' +
        '<div class="qrbox">' + qr + '</div>' +
        '<div class="linkrow"><input id="share-url-input" readonly value="' + esc(url) + '"><button type="button" class="btn btn-primary btn-sm" onclick="copyShareLink()">' + ICONS.copy + 'コピー</button></div>' +
        '<p class="lede" style="font-size:13.5px">この証文を仲間にお渡しになるか、QRコードをお読み取りいただければ、同じ帳簿がそちらにも開きます。お支払いに変更があった際は、新しい証文を配り直していただきますようお願いいたします。</p>' +
      '</div>' +
    '</div>';
  }


  // Enter submits the form the field belongs to (these are plain inputs, not <form>s).
  // Enter that merely confirms a Japanese conversion (isComposing / keyCode 229) is left alone.
  document.addEventListener('keydown', function (e) {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Escape') {
      if (ui.shareOpen) closeShare();
      else if (ui.addOpen) closeAddPayment();
      else if (ui.fgOpen && ui.fgStage === 'setup') closeFinalGacha();
      return;
    }
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (!t || t.tagName !== 'INPUT' || t.type === 'checkbox') return;
    var fn = null;
    if (t.id === 'ev-name' || t.classList.contains('member-name-input')) {
      // On the home form, Enter moves down the list of fields and creates the event from the last one.
      var fields = Array.prototype.slice.call(document.querySelectorAll('#ev-name, .member-name-input'));
      var next = fields[fields.indexOf(t) + 1];
      e.preventDefault();
      if (next) next.focus(); else window.createNewEvent();
      return;
    }
    if (t.id === 'new-member-name') fn = window.addMember;
    else if (t.id === 'pay-label' || t.id === 'pay-amount') fn = window.submitPayment;
    else if (t.classList.contains('rs-percent') || t.classList.contains('rs-weight')) fn = window.saveRouletteSettings;
    if (fn) { e.preventDefault(); fn(); }
  });

  window.addEventListener('hashchange', function () {
    if (ui.shareOpen || ui.addOpen) return;
    init();
  });

  init();
})();
</script>
</body>
</html>
