<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151009">
<title>闇ワリカ</title>
<meta name="description" content="飲み会や旅行の割り勘を記録して、最後は運命のルーレット＆ガチャで清算するWebアプリです。">
<meta property="og:type" content="website">
<meta property="og:title" content="闇ワリカ">
<meta property="og:description" content="飲み会や旅行の割り勘を記録して、最後は運命のルーレット＆ガチャで清算するWebアプリです。">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rampart+One&family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
  :root {
    --bg: oklch(14% 0.018 35);
    --surface: oklch(19% 0.024 32);
    --surface-2: oklch(24.5% 0.028 32);
    --border: oklch(33% 0.03 55);
    --card-border: oklch(45% 0.05 82 / 0.28);
    --text: oklch(95% 0.014 75);
    --text-secondary: oklch(75% 0.02 65);
    --text-tertiary: oklch(55% 0.02 55);
    --gold: oklch(80% 0.12 84);
    --accent: oklch(50% 0.19 24);
    --accent-soft: oklch(30% 0.045 80);
    --accent-text: var(--gold);
    --success-soft: oklch(27% 0.05 155);
    --success-text: oklch(74% 0.13 152);
    --warn-soft: oklch(28% 0.075 25);
    --warn-text: oklch(76% 0.17 27);
    --shadow-1: 0 1px 2px oklch(0% 0 0 / 0.5);
    --shadow-2: 0 10px 26px oklch(0% 0 0 / 0.55);
    --overlay: oklch(0% 0 0 / 0.72);
    --toast-bg: oklch(21% 0.035 30);
    --toast-text: oklch(95% 0.014 75);
  }

  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 55% at 50% -8%, oklch(38% 0.07 30 / 0.5), transparent 62%),
      repeating-linear-gradient(135deg, oklch(100% 0 0 / 0.014) 0 2px, transparent 2px 26px);
  }
  #app, #toast-root { position: relative; z-index: 1; }
  a { color: var(--accent-text); }
  button, input, select { font-family: inherit; }
  h1, h2, h3 { font-family: 'Rampart One', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
  .num { font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Small headings and the sentences that carry names are set in plain bold — the display font
     with a glow was hard to read at these sizes. */
  h3 { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-weight: 700; letter-spacing: 0.01em; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

  .appbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; background: var(--bg);
    border-bottom: 1px solid oklch(50% 0.08 80 / 0.22);
    box-shadow: 0 1px 0 oklch(0% 0 0 / 0.4);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark { width: 30px; height: 20px; position: relative; flex: 0 0 auto; }
  .brand-mark span {
    position: absolute; top: 0; width: 20px; height: 20px; border-radius: 50%;
    box-shadow: 0 0 0 1.5px var(--gold) inset, 0 1px 3px oklch(0% 0 0 / 0.5);
  }
  .brand-mark span:first-child { left: 0; background: repeating-conic-gradient(oklch(56% 0.19 24) 0deg 30deg, oklch(34% 0.13 22) 30deg 60deg); }
  .brand-mark span:last-child { left: 9px; background: repeating-conic-gradient(var(--gold) 0deg 30deg, oklch(48% 0.06 70) 30deg 60deg); }
  .brand-name {
    font-family: 'Rampart One', 'Hiragino Maru Gothic ProN', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: 0.03em;
    color: oklch(93% 0.1 86); -webkit-text-stroke: 0.4px oklch(93% 0.1 86);
    text-shadow: 0 0 14px oklch(80% 0.14 84 / 0.55), 0 1px 2px oklch(0% 0 0 / 0.6);
  }
  .appbar-title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; line-height: 1.3; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .iconbtn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
  }
  .iconbtn:hover { background: var(--surface-2); color: var(--text); }
  .reset-btn {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 3px 7px; border-radius: 10px;
  }
  .reset-btn:hover { background: var(--surface-2); color: var(--text); }
  .reset-btn span { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }

  .container { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 20px 20px 12px; }

  .card { background: var(--surface); border: 1px solid var(--card-border); border-radius: 18px; padding: 16px; box-shadow: var(--shadow-1), var(--shadow-2); }
  .card-flat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }

  .lede { color: oklch(80% 0.025 60); font-size: 14.5px; line-height: 1.75; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > label { font-size: 13.5px; font-weight: 700; color: var(--text-secondary); }
  .input {
    width: 100%; padding: 11px 13px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-size: 16px;
  }
  .input::placeholder { color: var(--text-tertiary); }
  select.input { appearance: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23b8935a' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
  select.input option { background: oklch(19% 0.024 32); color: oklch(95% 0.014 75); }

  .row { display: flex; align-items: center; gap: 8px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid transparent; border-radius: 13px; padding: 12px 17px; font-weight: 700; font-size: 15px;
    cursor: pointer;
  }
  .btn-primary {
    background: linear-gradient(180deg, oklch(57% 0.19 26), oklch(46% 0.18 22));
    color: oklch(98% 0.01 80); border-color: oklch(70% 0.14 32 / 0.45);
    box-shadow: 0 8px 18px oklch(50% 0.19 24 / 0.4), inset 0 1px 0 oklch(100% 0 0 / 0.15);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { background: var(--surface-2); color: var(--gold); border-color: oklch(60% 0.09 82 / 0.5); }
  .btn-block { width: 100%; }
  .btn-lever-cta { padding: 11px 22px; animation: lever-blink 1.1s ease-in-out infinite; }
  @keyframes lever-blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 oklch(80% 0.12 84 / 0); }
    50% { opacity: 0.6; box-shadow: 0 0 14px oklch(80% 0.12 84 / 0.5); }
  }
  .btn-sm { padding: 8px 13px; font-size: 14px; border-radius: 10px; }
  .btn-text { background: none; border: none; color: var(--accent-text); font-weight: 700; font-size: 14px; cursor: pointer; padding: 8px 2px; display: inline-flex; align-items: center; gap: 4px; }
  .err-text { color: var(--warn-text); font-size: 13.5px; min-height: 1em; }

  .badge { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .badge-accent { background: var(--accent-soft); color: var(--accent-text); }
  .badge-success { background: var(--success-soft); color: var(--success-text); }
  .badge-warn { background: var(--warn-soft); color: var(--warn-text); }

  /* Dark initial on a light disc: white on these pastel hues was hard to read. */
  .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; color: oklch(18% 0.03 50); font-weight: 700; flex: 0 0 auto; box-shadow: 0 0 0 2px var(--gold) inset, 0 2px 4px oklch(0% 0 0 / 0.4); }

  .chips { display: flex; flex-wrap: wrap; gap: 12px 4px; }
  .chip-member { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 80px; }
  .chip-member .name { font-size: 13px; font-weight: 500; line-height: 1.3; color: var(--text); max-width: 80px; text-align: center; overflow: hidden; overflow-wrap: break-word; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
  .chip-remove { position: relative; border: none; background: var(--surface-2); color: var(--text-tertiary); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: -14px; margin-left: 28px; }

  /* The visible × stays small, but the touchable area reaches 8px beyond it on every side. */
  .chip-remove::after { content: ''; position: absolute; inset: -8px; }
  .addmember-row { display: flex; gap: 8px; align-items: center; }
  .addmember-row .input { flex: 1; padding: 9px 12px; font-size: 16px; }

  .tabbar { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
  .tab { flex: 1; text-align: center; padding: 10px 10px; border-radius: 999px; font-weight: 700; font-size: 14.5px; color: var(--text-secondary); cursor: pointer; border: none; background: none; }
  .tab.active { background: var(--surface); color: var(--gold); box-shadow: var(--shadow-1); }

  .paycard { display: flex; align-items: center; gap: 8px; }
  .paycard .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .paycard .label { font-weight: 700; font-size: 15px; }
  /* keep-all: wrap only at the spaces around "・", never in the middle of "4人で割り勘". */
  .paycard .meta { word-break: keep-all; overflow-wrap: anywhere; }
  .paycard .sub { font-size: 12.5px; line-height: 1.5; color: var(--text-secondary); }
  .paycard .sub .who { color: var(--text); font-weight: 700; }
  .paycard .amt { font-weight: 900; font-size: 15px; white-space: nowrap; }
  .icon-danger, .icon-edit { color: var(--text-tertiary); background: none; border: none; cursor: pointer; padding: 10px; border-radius: 8px; flex: 0 0 auto; }
  .icon-danger:hover { color: var(--warn-text); background: var(--warn-soft); }
  .icon-edit:hover { color: var(--gold); background: var(--surface-2); }
  .icon-disabled { color: var(--text-tertiary); opacity: 0.5; width: 18px; height: 18px; align-items: center; justify-content: center; flex: 0 0 auto; }

  .empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 14px; color: var(--text-secondary); text-align: center; font-size: 14.5px; line-height: 1.7; }
  .empty svg { color: var(--text-tertiary); }

  .balance-row { display: flex; align-items: center; gap: 10px; }
  .balance-row .name { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .balance-amt { font-weight: 900; font-size: 15px; }
  .balance-amt.pos { color: var(--success-text); }
  .balance-amt.neg { color: var(--warn-text); }
  .balance-amt.zero { color: var(--text-tertiary); }

  .transfer-card { display: flex; flex-direction: column; gap: 10px; }
  .transfer-top { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
  .transfer-name { font-weight: 700; font-size: 14.5px; overflow-wrap: anywhere; }
  .transfer-amt { margin-left: auto; font-weight: 900; font-size: 15px; }
  .done-btn { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 10px; font-size: 13.5px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--accent-soft); color: var(--accent-text); background: none; }
  .done-btn.is-done { background: var(--success-soft); color: var(--success-text); border-color: var(--success-soft); }

  .fg-card { display: flex; flex-direction: column; gap: 12px; border: 1.5px dashed var(--gold); border-radius: 16px; padding: 14px; background: oklch(27% 0.05 78); }
  .fg-head { display: flex; align-items: center; gap: 8px; }
  .fg-head h3 { font-size: 15px; }
  .fg-result-row { display: flex; align-items: center; gap: 10px; }
  .fg-result-row .name { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
  .fg-links { display: flex; gap: 16px; justify-content: center; }

  .sticky-bottom { position: sticky; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 55%, transparent); }

  .gacha-percent-banner {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    background: oklch(30% 0.06 84);
    border: 1px solid var(--gold); color: var(--text); border-radius: 16px; padding: 16px;
    box-shadow: 0 0 20px oklch(78% 0.14 84 / 0.2) inset, 0 4px 14px oklch(0% 0 0 / 0.4);
  }
  .gacha-percent-banner .headline { font-weight: 700; font-size: 16px; line-height: 1.6; color: var(--gold); }
  .gacha-percent-banner .sub { font-size: 13px; font-weight: 600; color: oklch(88% 0.02 75); }

  .gacha-summary { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .gacha-summary .label { font-weight: 700; font-size: 15px; }
  .gacha-summary .amt { font-weight: 900; font-size: 20px; color: var(--gold); }
  .gacha-stage-text { text-align: center; font-weight: 700; font-size: 13.5px; color: var(--text-secondary); }

  /* ---------- gachapon machine ---------- */
  .gm-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .gm-machine { display: flex; flex-direction: column; align-items: center; }
  .gm-dome {
    position: relative; width: 220px; min-height: 120px; border-radius: 110px 110px 18px 18px;
    background: linear-gradient(180deg, oklch(48% 0.02 70 / 0.4), oklch(28% 0.02 60 / 0.32));
    border: 2px solid oklch(62% 0.05 78 / 0.6);
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 6px;
    padding: 16px 14px 10px; box-shadow: inset 0 -8px 16px oklch(0% 0 0 / 0.25), inset 0 6px 10px oklch(100% 0 0 / 0.2);
  }
  .gm-dome.shaking { animation: gm-shake 0.32s ease-in-out infinite; }
  .gm-capsule {
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'Rampart One', sans-serif; font-weight: 400; color: oklch(18% 0.03 50);
    box-shadow: 0 1px 2px oklch(0% 0 0 / 0.3), 0 0 0 1.5px oklch(80% 0.12 84 / 0.4) inset;
    animation: gm-jiggle 1.8s ease-in-out infinite;
  }
  .gm-capsule.gm-capsule-gone { opacity: 0; transform: scale(0.4); transition: opacity 0.3s ease, transform 0.3s ease; animation: none; }
  .gm-body {
    position: relative; width: 168px; margin-top: -8px; padding: 14px 14px 16px; border-radius: 0 0 20px 20px;
    background: linear-gradient(180deg, oklch(46% 0.18 22), oklch(30% 0.12 20));
    border: 1px solid oklch(55% 0.1 60 / 0.5); border-top: none;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    box-shadow: 0 6px 18px oklch(0% 0 0 / 0.5), inset 0 1px 0 oklch(100% 0 0 / 0.08);
  }
  .gm-crank {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid oklch(55% 0.09 70 / 0.6); cursor: pointer;
    background: radial-gradient(circle at 32% 28%, oklch(92% 0.08 84), oklch(68% 0.11 78));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 5px oklch(0% 0 0 / 0.45);
  }
  .gm-crank:disabled { cursor: default; opacity: 0.9; }
  .gm-crank-knob { width: 8px; height: 20px; border-radius: 4px; background: var(--accent); display: block; }
  .gm-crank.spinning .gm-crank-knob { animation: gm-crank-spin 0.32s linear infinite; }
  .gm-slot {
    width: 100%; height: 58px; border-radius: 10px; background: oklch(10% 0.02 25 / 0.65);
    border: 1px solid oklch(40% 0.06 25 / 0.6);
    display: flex; align-items: center; justify-content: center; overflow: visible;
    box-shadow: inset 0 3px 6px oklch(0% 0 0 / 0.5);
  }
  .gm-capsule-drop { position: relative; width: 52px; height: 52px; animation: gm-drop-in 0.5s cubic-bezier(.34,1.56,.64,1) both; }
  .gm-shell-top, .gm-shell-bottom {
    position: absolute; left: 0; width: 52px; height: 26px; overflow: hidden;
  }
  .gm-shell-top { top: 0; border-radius: 26px 26px 0 0; }
  .gm-shell-bottom { bottom: 0; border-radius: 0 0 26px 26px; }
  .gm-avatar-reveal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .gm-capsule-drop.cracking .gm-shell-top { animation: gm-shell-top-open 0.48s ease-in forwards; }
  .gm-capsule-drop.cracking .gm-shell-bottom { animation: gm-shell-bottom-open 0.48s ease-in forwards; }

  @keyframes gm-jiggle {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50% { transform: rotate(4deg) translateY(-2px); }
  }
  @keyframes gm-shake {
    0% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-3px,1px) rotate(-1.5deg); }
    50% { transform: translate(3px,-1px) rotate(1.5deg); }
    75% { transform: translate(-2px,-1px) rotate(-1deg); }
    100% { transform: translate(0,0) rotate(0); }
  }
  @keyframes gm-crank-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  @keyframes gm-drop-in {
    0% { transform: translateY(-46px) scale(0.7); opacity: 0; }
    70% { transform: translateY(4px) scale(1.05); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes gm-shell-top-open { to { transform: translate(-10px, -16px) rotate(-40deg); opacity: 0; } }
  @keyframes gm-shell-bottom-open { to { transform: translate(10px, 16px) rotate(40deg); opacity: 0; } }

  /* ---------- percent roulette wheel ---------- */
  .rw-wrap { position: relative; width: 220px; height: 220px; margin: 10px auto 6px; }
  .rw-wheel {
    position: absolute; inset: 0; border-radius: 50%;
    border: 4px solid var(--gold);
    box-shadow: 0 8px 20px oklch(0% 0 0 / 0.5), inset 0 0 0 2px oklch(0% 0 0 / 0.35);
  }
  .rw-wheel.rw-spinning { animation: rw-spin 0.8s linear infinite; }
  @keyframes rw-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .rw-label {
    position: absolute; top: 50%; left: 50%; width: 44px; height: 20px; margin: -10px 0 0 -22px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 900; font-size: 14px; text-shadow: 0 1px 2px oklch(0% 0 0 / 0.6);
    pointer-events: none;
  }
  .rw-label-jackpot {
    width: 34px; margin-left: -17px; font-size: 11.5px; color: oklch(95% 0.05 90);
    text-shadow: 0 0 5px oklch(70% 0.2 25 / 0.9), 0 1px 2px oklch(0% 0 0 / 0.7);
  }
  .rw-label-lucky { color: oklch(20% 0.03 60); text-shadow: none; }
  .rw-pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent;
    border-top: 18px solid var(--gold); filter: drop-shadow(0 2px 3px oklch(0% 0 0 / 0.5));
    z-index: 2;
  }
  .rw-hub {
    position: absolute; top: 50%; left: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, oklch(92% 0.08 84), oklch(68% 0.11 78));
    box-shadow: 0 0 0 2px oklch(0% 0 0 / 0.4), 0 2px 4px oklch(0% 0 0 / 0.5);
    z-index: 1;
  }

  .gacha-result-banner {
    display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
    background: oklch(30% 0.08 25);
    border: 1px solid var(--warn-text); color: var(--text); border-radius: 16px; padding: 16px;
    box-shadow: 0 0 20px oklch(60% 0.18 25 / 0.25) inset, 0 4px 14px oklch(0% 0 0 / 0.4);
  }
  .gacha-result-banner .headline { font-weight: 700; font-size: 16px; line-height: 1.6; color: var(--warn-text); }
  .gacha-result-banner.is-lucky { background: oklch(30% 0.07 150); border-color: var(--success-text); }

  .gacha-result-banner .roast { font-size: 13.5px; font-weight: 500; color: oklch(88% 0.02 60); line-height: 1.7; }
  .gacha-breakdown { display: flex; flex-direction: column; gap: 6px; }

  .hint {
    display: flex; gap: 10px; align-items: flex-start; background: oklch(28% 0.05 78); color: oklch(92% 0.02 75);
    border-left: 3px solid var(--gold); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; line-height: 1.7;
  }
  .hint svg { flex: 0 0 auto; margin-top: 1px; }
  .hint-close { margin-left: auto; background: none; border: none; color: inherit; opacity: 0.6; cursor: pointer; flex: 0 0 auto; }

  .overlay {
    position: fixed; inset: 0; background: var(--overlay); z-index: 50;
    display: flex; align-items: flex-end; justify-content: center; padding: 0;
  }
  .sheet {
    width: 100%; max-width: 480px; background: var(--bg); border-radius: 22px 22px 0 0;

    .overlay { align-items: center; }

  }
  .sheet-head { display: flex; align-items: center; gap: 10px; }
  .sheet-head h2 { flex: 1; font-size: 17px; }

  .qrbox { background: white; border-radius: 16px; padding: 16px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--gold); box-shadow: 0 0 0 1px var(--accent) inset; }
  .qrbox svg { width: 176px; height: 176px; display: block; }

  .linkrow { display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .linkrow input { flex: 1; border: none; background: none; color: var(--text-secondary); font-size: 12px; font-family: monospace; outline: none; min-width: 0; }

  .toast {
    pointer-events: auto; display: flex; align-items: center; gap: 10px; background: var(--toast-bg); color: var(--toast-text);
    padding: 12px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; max-width: calc(100vw - 40px);
    border: 1px solid oklch(60% 0.09 82 / 0.4);
    box-shadow: var(--shadow-2); animation: toast-in 0.18s ease-out;
  }

  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .divider-text { display: flex; align-items: center; gap: 10px; color: var(--text-tertiary); font-size: 12px; }
  .divider-text .line { flex: 1; height: 1px; background: var(--border); }

  /* ---------- roulette settings form ---------- */
  .rs-grid { display: grid; grid-template-columns: 1fr 1fr 58px 30px; gap: 8px; align-items: center; }
  .rs-head { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); }

<div id="app"></div>

<script>
/*__QRCODE_GENERATOR_LIBRARY__*/
</script>

<script>
(function () {
  'use strict';

  var HUES = [40, 155, 280, 200, 320, 95, 10, 240];
  function hueForId(id) { return HUES[Math.abs(id - 1) % HUES.length]; }

  var ICONS = {
    plus: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    reset: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
    share: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.7l7.6-4.4M8.2 13.3l7.6 4.4"/></svg>',
    edit: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>',
    trash: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
    lock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    copy: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    arrow: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
    receipt: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6"/></svg>',
    scale: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M6 8l-3 6a3 3 0 0 0 6 0l-3-6zM18 8l-3 6a3 3 0 0 0 6 0l-3-6z"/><path d="M5 21h14M6 8h12"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>',
    dice: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.3" fill="currentColor" stroke="none"/></svg>',
  };

  // One-line barbs read out to whoever the gacha just landed on — a little sting,
  // never actually mean-spirited; purely about luck/money, never the person.
  var ROASTS = [
    '日頃の行いが出た、ということでございましょう。',
    '運にも見放されるタイプと、確定いたしました。',
    'これは実力か、それとも単なる不運か。ご自身でお確かめくださいませ。',
    '神様はご覧になっておいでです。本日は、あなた様をお選びになったようで。',
    '奢りの才能だけは、本物でいらっしゃるようです。',
    '運命は、誠に容赦がございません。',
    '本日の主役、決定いたしました。',
    'これも、社会勉強でございます。',
    '貧乏くじを引き当てるその才能、見事でございます。',
    'どなたも、庇ってはくださいません。',
    '拍手は不要でございます。どうぞ財布をお開きください。',
    '抽選は平等、結果はいつも残酷でございます。',
    '次回は、サイコロをお疑いになることをお勧めいたします。',
    'ツキに見放された夜、ということでございましょう。',
    '財布よりも先に、お心が痛むタイプのようでございます。'
  ];
  var LUCKY_LINES = [
    '運命は、あなた様に微笑みました。',
    '日頃の行いが、ここで報われたようでございます。',
    '奢られる側へ、鮮やかな大逆転でございます。',
    '皆様、どうぞ拍手を。そして財布をお開きください。',
    '本日の主役は、間違いなくあなた様でございます。',
    '捨てる神あれば拾う神あり、と申します。'
  ];
  function pickRoast(percent) {
    var list = percent < 0 ? LUCKY_LINES : ROASTS;
    return list[Math.floor(Math.random() * list.length)];
  }

  // Candidate penalty percentages for the final gacha's first roulette (of the event total),
  // each with a relative weight (need not sum to 100 — normalized at draw time, though they
  // do here for readability). Whichever entry has the lowest weight is treated as the rare
  // "jackpot" draw and gets a distinct color/label treatment on the wheel.
  // A negative percentage is the comeback: the person the gacha picked does not pay, they
  // RECEIVE that share of the total, paid by everyone else (split evenly).
  var FG_ROULETTE_DEFAULT = [
    { percent: -20, weight: 6 },
    { percent: 1, weight: 8 },
    { percent: 5, weight: 38 },
    { percent: 10, weight: 28 },
    { percent: 20, weight: 19 },
    { percent: 50, weight: 1 }
  ];
  var FG_MIN_ITEMS = 2, FG_MAX_ITEMS = 8;
  var MAX_AMOUNT = 999999999999;
  // The gacha can be reflected into the books this many times per event: the first draw plus
  // one redraw. Undoing a result ("取り消す") does not give the draws back.
  var FG_MAX_DRAWS = 2;

  // Each event may carry its own roulette as state.r = [[percent, weight], ...] (set from
  // the final gacha's "ルーレットの設定"). The value comes from the share URL, so it is
  // validated here and anything malformed quietly falls back to the defaults.
  function sanitizeRoulette(r) {
    if (!Array.isArray(r) || r.length < FG_MIN_ITEMS || r.length > FG_MAX_ITEMS) return null;
    var out = [];
    for (var i = 0; i < r.length; i++) {
      var e = r[i];
      if (!Array.isArray(e)) return null;
      var p = e[0], w = e[1];
      if (!Number.isInteger(p) || p === 0 || p < -100 || p > 100) return null;
      if (!Number.isInteger(w) || w < 1 || w > 100) return null;
      out.push({ percent: p, weight: w });
    }
    return out;
  }
  function fgRoulette() {
    return (state && sanitizeRoulette(state.r)) || FG_ROULETTE_DEFAULT;
  }

  // Sector geometry for the roulette wheel: cumulative degrees proportional to weight.
  // The lowest-weight entry is the rare "jackpot" — unless every weight is equal, in which
  // case nothing is rare.
  function rouletteSectors() {
    var items = fgRoulette();
    var total = items.reduce(function (s, r) { return s + r.weight; }, 0);
    var minWeight = Math.min.apply(null, items.map(function (r) { return r.weight; }));
    var maxWeight = Math.max.apply(null, items.map(function (r) { return r.weight; }));
    var acc = 0;
    return items.map(function (r) {
      var start = acc / total * 360;
      acc += r.weight;
      var end = acc / total * 360;
      return { percent: r.percent, negative: r.percent < 0, start: start, end: end, center: (start + end) / 2, rare: minWeight < maxWeight && r.weight === minWeight };
    });
  }

  // Weighted random draw — returns an index into fgRoulette().
  function pickWeightedRouletteIndex() {
    var items = fgRoulette();
    var total = items.reduce(function (s, r) { return s + r.weight; }, 0);
    var r = Math.random() * total;
    var acc = 0;
    for (var i = 0; i < items.length; i++) {
      acc += items[i].weight;
      if (r < acc) return i;
    }
    return items.length - 1;
  }

  // ---------- state encode / decode ----------
  function encodeState(obj) {
    var json = JSON.stringify(obj);
    var bytes = new TextEncoder().encode(json);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  // The share URL is untrusted input (anyone can hand you a crafted link) and its values
  // end up inside HTML and inline onclick attributes, so every field is re-built here:
  // ids and amounts must be plain integers, text must be strings, unknown fields are
  // dropped. A link that doesn't fit throws, which init() reports as an unreadable link.
  function isId(x) { return Number.isSafeInteger(x) && x > 0; }
  function sanitizeState(obj) {
    if (!obj || typeof obj !== 'object' || typeof obj.n !== 'string' || !Array.isArray(obj.m) || !Array.isArray(obj.p)) {
      throw new Error('invalid state shape');
    }
    var memberIds = {};
    var members = obj.m.map(function (m) {
      if (!m || !isId(m.i) || typeof m.a !== 'string' || memberIds[m.i]) throw new Error('invalid member');
      memberIds[m.i] = true;
      return { i: m.i, a: m.a };
    });
    var payIds = {};
    var payments = obj.p.map(function (p) {
      if (!p || !isId(p.i) || payIds[p.i] || !isId(p.y) || !memberIds[p.y] || typeof p.l !== 'string' ||
          !Number.isSafeInteger(p.a) || p.a <= 0 || !Array.isArray(p.s)) throw new Error('invalid payment');
      payIds[p.i] = true;
      var seen = {};
      var s = p.s.filter(function (id) {
        if (!isId(id) || !memberIds[id] || seen[id]) return false;
        seen[id] = true;
        return true;
      });
      if (!s.length) throw new Error('invalid payment participants');
      return { i: p.i, y: p.y, l: p.l, a: p.a, s: s };
    });
    var out = {
      v: 1, n: obj.n, m: members, p: payments,
      // Only keys of the current form ("from-to-amount") survive; older "from-to" marks are dropped.
      d: Array.isArray(obj.d) ? obj.d.filter(function (k) { return typeof k === 'string' && /^\d+-\d+-\d+$/.test(k); }) : []
    };
    var fg = obj.fg;
    if (fg && typeof fg === 'object' && isId(fg.loser) && Number.isSafeInteger(fg.amount)) {
      out.fg = { loser: fg.loser, amount: fg.amount };
      if (Number.isInteger(fg.percent) && fg.percent !== 0 && fg.percent >= -100 && fg.percent <= 100) out.fg.percent = fg.percent;
    }
    if (sanitizeRoulette(obj.r)) out.r = obj.r;
    if (Number.isInteger(obj.g) && obj.g >= 1 && obj.g <= 99) out.g = obj.g;
    return out;
  }
  function decodeState(str) {
    var b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var json = new TextDecoder().decode(bytes);
    return sanitizeState(JSON.parse(json));
  }
  function shareUrl() {
    return location.origin + location.pathname + location.search + '#s=' + encodeState(state);
  }

  // ---------- settlement math ----------
  // Splits `amount` (integer yen) across `weights` (parallel array), summing back to
  // exactly `amount` via the largest-remainder method. weights of all 1 == equal split.
  function splitByWeight(amount, weights) {
    var totalWeight = weights.reduce(function (a, b) { return a + b; }, 0);
    if (!totalWeight) return weights.map(function () { return 0; });
    var raw = weights.map(function (w) { return amount * w / totalWeight; });
    var shares = raw.map(Math.floor);
    var used = shares.reduce(function (a, b) { return a + b; }, 0);
    var remainder = amount - used;
    var order = raw.map(function (r, i) { return { i: i, frac: r - Math.floor(r) }; })
      .sort(function (a, b) { return b.frac - a.frac; });
    for (var k = 0; k < remainder; k++) shares[order[k % order.length].i] += 1;
    return shares;
  }
  // Weights for one payment's participants — always an equal split.
  function paymentWeights(pay) {
    return pay.s.map(function () { return 1; });
  }
  function totalSpent(st) {
    return st.p.reduce(function (s, p) { return s + p.a; }, 0);
  }
  // The final gacha's penalty is always "percent of the current total", so it follows later
  // changes to the payments instead of staying at the amount from the moment of the draw.
  // (Older links without a percent fall back to the saved amount.)
  function fgAmount(st) {
    return st.fg.percent ? penaltyAmount(totalSpent(st), st.fg.percent) : st.fg.amount;
  }
  // Signed: positive = the picked member pays, negative = the picked member receives.
  // Rounds the same way in both directions.
  function penaltyAmount(total, percent) {
    return (percent < 0 ? -1 : 1) * Math.round(total * Math.abs(percent) / 100);
  }
  function computeSettlement(st) {
    var ids = st.m.map(function (m) { return m.i; });
    var paid = {}, owed = {};
    ids.forEach(function (id) { paid[id] = 0; owed[id] = 0; });
    st.p.forEach(function (pay) {
      paid[pay.y] = (paid[pay.y] || 0) + pay.a;
      var parts = pay.s;
      var n = parts.length;
      if (!n) return;
      var shares = splitByWeight(pay.a, paymentWeights(pay));
      parts.forEach(function (pid, idx) {
        owed[pid] = (owed[pid] || 0) + shares[idx];
      });
    });
    var net = {};
    ids.forEach(function (id) { net[id] = (paid[id] || 0) - (owed[id] || 0); });
    // Final gacha: the picked member's net drops by the penalty; that amount is split evenly
    // back to everyone else as relief. A negative penalty is the comeback — the picked member
    // gains it and everyone else pays it. Either way the total net still sums to zero.
    if (st.fg && ids.indexOf(st.fg.loser) !== -1) {
      var others = ids.filter(function (id) { return id !== st.fg.loser; });
      if (others.length) {
        var penalty = fgAmount(st);
        var sign = penalty < 0 ? -1 : 1;
        var relief = splitByWeight(Math.abs(penalty), others.map(function () { return 1; }));
        net[st.fg.loser] -= penalty;
        others.forEach(function (id, idx) { net[id] += sign * relief[idx]; });
      }
    }
    var creditors = ids.filter(function (id) { return net[id] > 0; })
      .map(function (id) { return { id: id, amt: net[id] }; })
      .sort(function (a, b) { return b.amt - a.amt; });
    var debtors = ids.filter(function (id) { return net[id] < 0; })
      .map(function (id) { return { id: id, amt: -net[id] }; })
      .sort(function (a, b) { return b.amt - a.amt; });
    var transfers = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      var c = creditors[ci], d = debtors[di];
      var amt = Math.min(c.amt, d.amt);
      // The amount is part of the key: if the sum owed changes, an earlier "送金済み" mark
      // must not carry over to what is now a different transfer.
      if (amt > 0) transfers.push({ from: d.id, to: c.id, amount: amt, key: d.id + '-' + c.id + '-' + amt });
      c.amt -= amt; d.amt -= amt;
      if (c.amt === 0) ci++;
      if (d.amt === 0) di++;
    }
    return { paid: paid, owed: owed, net: net, transfers: transfers };
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }
  function memberName(st, id) {
    var m = st.m.find(function (x) { return x.i === id; });
    return m ? m.a : '？';
  }
  function initial(name) { return (name || '').trim().charAt(0) || '?'; }
  function avatarHtml(id, name, size) {
    size = size || 36;
    var fs = Math.round(size * 0.42);
    return '<div class="avatar" style="width:' + size + 'px;height:' + size + 'px;font-size:' + fs + 'px;background:oklch(76% 0.13 ' + hueForId(id) + ')">' + esc(initial(name)) + '</div>';
  }
  function isMemberPayer(st, id) {
    return st.p.some(function (p) { return p.y === id; });
  }
  function nextId(list) {
    return list.reduce(function (mx, x) { return Math.max(mx, x.i); }, 0) + 1;
  }

  // ---------- app state ----------
  function freshUi() {
    return {
      tab: 'pay', addOpen: false, editPaymentId: null, shareOpen: false, homeError: '', memberError: '',
      machine: null, roulette: null,
      fgOpen: false, fgStage: 'setup', fgPercent: null, fgWinner: null, fgRoast: null, fgDraft: null
    };
  }
  var state = null;
  var ui = freshUi();

  function init() {
    undoSnapshot = null;
    var h = location.hash || '';
    if (h.indexOf('#s=') === 0) {
      try {
        state = decodeState(h.slice(3));
      } catch (e) {
        state = null;
        ui.homeError = 'リンクを正しく読み込めませんでした。新しくイベントを作成してください。';
      }
    }
    render();
  }

  // Every state change goes through commit(). It also drops any pending "元に戻す" — an
  // undo is only offered right after the deletion it belongs to, before anything else changes.
  function commit() {
    undoSnapshot = null;
    ui.memberError = '';
    clearToast();
    // "送金済み" marks only make sense for transfers that still exist as-is.
    if (state.d.length) {
      var live = computeSettlement(state).transfers.map(function (t) { return t.key; });
      state.d = state.d.filter(function (k) { return live.indexOf(k) !== -1; });
    }
    try { history.replaceState(null, '', shareUrl()); } catch (e) {}
    render();
  }

  function resetHome() {
    state = null;
    ui = freshUi();
    undoSnapshot = null;
    clearToast();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    render();
  }

  // ---------- toast (own root, never touched by render()) ----------
  var toastTimer = null;
  function clearToast() {
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    var root = document.getElementById('toast-root');
    if (root) root.innerHTML = '';
  }
  // withUndo adds a "元に戻す" button (see deleteWithUndo) and keeps the toast up longer.
  function showToast(msg, withUndo) {
    var root = document.getElementById('toast-root');
    root.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' +
      (withUndo ? '<button type="button" onclick="undoLast()">元に戻す</button>' : '') + '</div>';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { root.innerHTML = ''; undoSnapshot = null; }, withUndo ? 8000 : 3200);
  }

  // Deletions have no confirmation dialog; instead they can be taken back for a few seconds.
  // The whole state is small (it lives in the URL), so undo just restores a copy of it.
  var undoSnapshot = null;
  // msg may be a function, so the text can depend on what mutate() found to change.
  function deleteWithUndo(mutate, msg) {
    var snapshot = JSON.stringify(state);
    mutate();
    commit();
    undoSnapshot = snapshot;
    showToast(typeof msg === 'function' ? msg() : msg, true);
  }
  window.undoLast = function () {
    if (!undoSnapshot) return;
    state = JSON.parse(undoSnapshot);
    commit();
    showToast('元に戻しました。');
  };

  // Same name (ignoring case and surrounding spaces) would make two people impossible to tell apart.
  function hasDuplicateName(names) {
    var lower = names.map(function (n) { return n.trim().toLowerCase(); });
    return lower.some(function (n, i) { return lower.indexOf(n) !== i; });
  }

  // ---------- mutations ----------
  window.createNewEvent = function () {
    var nameEl = document.getElementById('ev-name');
    var errEl = document.getElementById('create-err');
    var name = (nameEl.value || '').trim();
    var nameInputs = document.querySelectorAll('.member-name-input');
    var names = Array.prototype.map.call(nameInputs, function (el) { return el.value.trim(); }).filter(Boolean);
    if (!name) { errEl.textContent = 'イベント名を入力してください。'; nameEl.focus(); return; }
    if (names.length < 2) { errEl.textContent = 'メンバーを2人以上入力してください。'; return; }
    if (hasDuplicateName(names)) { errEl.textContent = '同じ名前のメンバーがいます。「田中A」「田中B」のように区別してください。'; return; }
    errEl.textContent = '';
    var members = names.map(function (n, i) { return { i: i + 1, a: n }; });
    state = { v: 1, n: name, m: members, p: [], d: [] };
    ui = freshUi();
    commit();
  };

  window.addMemberRow = function () {
    var wrap = document.getElementById('member-rows');
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<input class="input member-name-input" maxlength="20" placeholder="名前" style="flex:1">' +
      '<button type="button" class="chip-remove" style="margin:0;width:30px;height:30px" onclick="this.parentElement.remove()" aria-label="削除">' + ICONS.close + '</button>';
    wrap.appendChild(row);
    row.querySelector('input').focus();
  };

  window.addMember = function () {
    var input = document.getElementById('new-member-name');
    var name = (input.value || '').trim();
    if (!name) { input.focus(); return; }
    if (hasDuplicateName(state.m.map(function (m) { return m.a; }).concat(name))) {
      ui.memberError = '同じ名前のメンバーがすでにいます。区別できる名前にしてください。';
      render();
      var again = document.getElementById('new-member-name');
      again.value = name; again.focus();
      return;
    }
    state.m.push({ i: nextId(state.m), a: name });
    commit();
    showToast('仲間をテーブルにお迎えいたしました。新しい証文をお配りください。');
  };

  window.removeMember = function (id) {
    if (state.m.length <= 2) {
      ui.memberError = 'メンバーは最低2人必要なため、これ以上は削除できません。';
      render();
      return;
    }
    if (isMemberPayer(state, id)) {
      ui.memberError = 'この人が支払いを記録しているため削除できません。先にその支払いを削除してください。';
      render();
      return;
    }
    var touched = false, gachaCleared = false;
    ui.memberError = '';
    deleteWithUndo(function () {
      state.m = state.m.filter(function (m) { return m.i !== id; });
      state.p.forEach(function (p) {
        if (p.s.indexOf(id) !== -1) {
          p.s = p.s.filter(function (pid) { return pid !== id; });
          if (!p.s.length) p.s = [p.y];
          touched = true;
        }
      });
      // Ids are handed out as max+1, so a removed id can be reused by the next new member.
      // Drop the gacha result that pointed at this person, or it would land on the newcomer.
      if (state.fg && state.fg.loser === id) { delete state.fg; delete state.g; gachaCleared = true; }
    }, function () {
      return 'そのお名前はテーブルよりお下がりいただきました。' + (touched ? '関わる勘定も整理いたしました。' : '') +
        (gachaCleared ? '最終ガチャの裁定も取り消しました。' : '') + '新しい証文をお配りください。';
    });
  };

  window.openAddPayment = function () {
    ui.editPaymentId = null;
    ui.addOpen = true;
    render();
  };
  // The same sheet doubles as the edit form when ui.editPaymentId is set.
  window.openEditPayment = function (id) {
    ui.editPaymentId = id;
    ui.addOpen = true;
    render();
  };
  window.closeAddPayment = function () {
    ui.addOpen = false;
    ui.editPaymentId = null;
    render();
  };

  window.submitPayment = function () {
    var payer = parseInt(document.getElementById('pay-payer').value, 10);
    var label = (document.getElementById('pay-label').value || '').trim();
    var amountText = (document.getElementById('pay-amount').value || '').trim();
    var amount = /^\d+$/.test(amountText) ? parseInt(amountText, 10) : NaN;
    var checks = document.querySelectorAll('.pay-participant:checked');
    var participants = Array.prototype.map.call(checks, function (c) { return parseInt(c.value, 10); });
    var errEl = document.getElementById('pay-err');
    if (!label) { errEl.textContent = '内容を入力してください。'; return; }
    if (!amount || amount <= 0) { errEl.textContent = '金額は1円以上の整数で入力してください。'; return; }
    if (amount > MAX_AMOUNT) { errEl.textContent = '金額が大きすぎます（1兆円未満で入力してください）。'; return; }
    if (!participants.length) { errEl.textContent = '対象者を1人以上選んでください。'; return; }
    errEl.textContent = '';
    var editing = ui.editPaymentId !== null && state.p.find(function (p) { return p.i === ui.editPaymentId; });
    if (editing) {
      editing.y = payer; editing.l = label; editing.a = amount; editing.s = participants;
    } else {
      state.p.push({ i: nextId(state.p), y: payer, l: label, a: amount, s: participants });
    }
    ui.addOpen = false;
    ui.editPaymentId = null;
    commit();
    showToast(editing ? 'その一筆を書き改めました。新しい証文をお配りください。' : '一筆、帳簿に記録いたしました。新しい証文をお配りください。');
  };

  // ---------- gachapon machine (final gacha, step 1: who is picked) ----------
  var gachaTimer = null;
  window.pullLever = function () {
    if (!ui.machine || ui.machine.phase !== 'idle') return;
    var m = ui.machine;
    var winner = m.participants[Math.floor(Math.random() * m.participants.length)];
    m.phase = 'shaking';
    render();
    gachaTimer = setTimeout(function () {
      m.phase = 'dropping';
      m.winner = winner;
      render();
      gachaTimer = setTimeout(function () {
        m.phase = 'cracking';
        render();
        gachaTimer = setTimeout(function () {
          gachaTimer = null;
          ui.fgWinner = winner;
          ui.fgStage = 'loserResult';
          render();
        }, 650);
      }, 700);
    }, 2200);
  };

  function freshMemberMachine() {
    return { kind: 'member', phase: 'idle', winner: null, participants: state.m.map(function (m) { return m.i; }) };
  }

  // ---------- percent roulette (final gacha, step 2: the penalty %, negative = comeback) ----------
  // A spinning wheel with a fixed pointer. It starts spinning the moment this stage
  // opens; pressing "ストップ" freezes it at its live angle, then eases it to a rest
  // angle (several extra full turns plus an offset) that lands the chosen percentage
  // under the pointer, so the deceleration itself reads as the draw.
  var rouletteTimer = null;
  var ROULETTE_STOP_MS = 3200;

  function freshRoulette() {
    return { phase: 'spinning', finalAngle: 0 };
  }

  function renderRouletteWheel(angleDeg, spinning) {
    var sectors = rouletteSectors();
    var hueIdx = 0;
    var stops = sectors.map(function (s) {
      var color;
      if (s.negative) {
        color = 'oklch(80% 0.13 88)';                       // gold: the comeback wedge
      } else {
        color = s.rare ? 'oklch(64% 0.22 25)' : 'oklch(58% 0.15 ' + HUES[hueIdx % HUES.length] + ')';
        hueIdx++;
      }
      return color + ' ' + s.start + 'deg ' + s.end + 'deg';
    }).join(', ');
    var labels = sectors.map(function (s) {
      // The rarest wedge is usually the thinnest and often sits right next to its
      // neighbor near the pointer, so its label is pulled to a further-out radius
      // to keep the two from colliding.
      var radius = s.negative ? 60 : (s.rare ? 90 : 70);
      return '<span class="rw-label' + (s.rare ? ' rw-label-jackpot' : '') + (s.negative ? ' rw-label-lucky' : '') + '" style="transform:rotate(' + s.center + 'deg) translateY(-' + radius + 'px) rotate(-' + s.center + 'deg)">' + (s.negative ? '\u2212' + Math.abs(s.percent) : s.percent) + '%</span>';
    }).join('');
    var styleAttr = spinning
      ? 'background:conic-gradient(from 0deg, ' + stops + ')'
      : 'transform:rotate(' + angleDeg + 'deg);background:conic-gradient(from 0deg, ' + stops + ')';
    return '' +
      '<div class="rw-wrap">' +
        '<div class="rw-pointer"></div>' +
        '<div id="rw-wheel" class="rw-wheel' + (spinning ? ' rw-spinning' : '') + '" style="' + styleAttr + '">' + labels + '</div>' +
        '<div class="rw-hub"></div>' +
      '</div>';
  }

  window.stopRoulette = function () {
    if (!ui.roulette || ui.roulette.phase !== 'spinning') return;
    var el = document.getElementById('rw-wheel');
    if (!el) return;
    var btn = document.getElementById('rw-stop-btn');
    if (btn) btn.disabled = true;

    var angle = 0;
    var cs = getComputedStyle(el).transform;
    if (cs && cs !== 'none') {
      var mtx = cs.match(/matrix\(([^,]+),\s*([^,]+),/);
      if (mtx) angle = Math.atan2(parseFloat(mtx[2]), parseFloat(mtx[1])) * 180 / Math.PI;
    }
    if (angle < 0) angle += 360;

    el.style.animation = 'none';
    el.classList.remove('rw-spinning');
    el.style.transform = 'rotate(' + angle + 'deg)';
    void el.offsetWidth;

    var sectors = rouletteSectors();
    var idx = pickWeightedRouletteIndex();
    var winner = fgRoulette()[idx].percent;
    var center = sectors[idx].center;
    var targetMod = (360 - center) % 360;
    var delta = ((targetMod - angle) % 360 + 360) % 360;
    var finalAngle = angle + delta + 5 * 360;

    el.style.transition = 'transform ' + (ROULETTE_STOP_MS / 1000) + 's cubic-bezier(0.11, 0.82, 0.15, 1)';
    requestAnimationFrame(function () {
      el.style.transform = 'rotate(' + finalAngle + 'deg)';
    });

    ui.roulette.phase = 'stopping';
    ui.roulette.finalAngle = finalAngle;

    rouletteTimer = setTimeout(function () {
      rouletteTimer = null;
      ui.roulette.phase = 'done';
      ui.fgPercent = winner;
      ui.fgStage = 'result';
      ui.fgRoast = pickRoast(winner);
      render();
    }, ROULETTE_STOP_MS);
  };

  // ---------- final gacha (settlement-tab, one draw per event) ----------
  // Two draws in sequence: first the gachapon picks the member, then the roulette picks the
  // percentage of the event total (a negative one turns the penalty into a payout for that
  // member). Redrawing always restarts from the gachapon.
  window.openFinalGacha = function () {
    ui.fgOpen = true; ui.fgStage = 'setup'; ui.fgPercent = null; ui.fgWinner = null; ui.machine = null; ui.roulette = null;
    render();
  };
  window.closeFinalGacha = function () {
    if (gachaTimer) { clearTimeout(gachaTimer); gachaTimer = null; }
    if (rouletteTimer) { clearTimeout(rouletteTimer); rouletteTimer = null; }
    ui.fgOpen = false; ui.fgStage = 'setup'; ui.fgPercent = null; ui.fgWinner = null; ui.machine = null; ui.roulette = null; ui.fgDraft = null;
    render();
  };

  // ---------- roulette settings (edit the wheel's percentages and how likely each is) ----------
  // The form is edited as a draft of strings (ui.fgDraft). Rows are added/removed by
  // re-rendering, so the typed values are copied out of the DOM into the draft first.
  function readRouletteDraft() {
    var rows = document.querySelectorAll('.rs-row');
    if (!rows.length) return;
    ui.fgDraft = Array.prototype.map.call(rows, function (row) {
      return { p: row.querySelector('.rs-percent').value, w: row.querySelector('.rs-weight').value };
    });
  }
  function setRouletteError(msg) {
    var el = document.getElementById('rs-err');
    if (el) el.textContent = msg;
  }
  // "Chance" shown next to each row: its weight as a share of all valid weights.
  function rouletteChanceTexts(weightStrs) {
    var valid = weightStrs.map(function (s) { return /^\d+$/.test(s) && parseInt(s, 10) >= 1 ? parseInt(s, 10) : 0; });
    var total = valid.reduce(function (a, b) { return a + b; }, 0);
    return valid.map(function (w) { return w && total ? (Math.round(w / total * 1000) / 10) + '%' : '—'; });
  }
  window.updateRouletteChances = function () {
    var rows = document.querySelectorAll('.rs-row');
    var texts = rouletteChanceTexts(Array.prototype.map.call(rows, function (row) { return row.querySelector('.rs-weight').value; }));
    Array.prototype.forEach.call(rows, function (row, i) { row.querySelector('.rs-chance').textContent = texts[i]; });
  };

  window.openRouletteSettings = function () {
    ui.fgDraft = fgRoulette().map(function (r) { return { p: String(r.percent), w: String(r.weight) }; });
    ui.fgStage = 'settings';
    render();
  };
  window.cancelRouletteSettings = function () {
    ui.fgDraft = null; ui.fgStage = 'setup';
    render();
  };
  window.addRouletteRow = function () {
    readRouletteDraft();
    if (ui.fgDraft.length >= FG_MAX_ITEMS) { setRouletteError('項目は最大' + FG_MAX_ITEMS + '個までです。'); return; }
    ui.fgDraft.push({ p: '', w: '10' });
    render();
  };
  window.removeRouletteRow = function (i) {
    readRouletteDraft();
    if (ui.fgDraft.length <= FG_MIN_ITEMS) { setRouletteError('項目は最低' + FG_MIN_ITEMS + '個必要です。'); return; }
    ui.fgDraft.splice(i, 1);

  window.resetRouletteDraft = function () {

    render();
  };
  window.saveRouletteSettings = function () {
    readRouletteDraft();
    var items = [];
    for (var i = 0; i < ui.fgDraft.length; i++) {
      var d = ui.fgDraft[i];
      var rowNo = (i + 1) + '行目：';
      if (!/^-?\d+$/.test(d.p) || parseInt(d.p, 10) === 0 || Math.abs(parseInt(d.p, 10)) > 100) { setRouletteError(rowNo + '罰金の割合は1〜100の整数で入力してください（マイナスは-1〜-100。0にはできません）。'); return; }
      if (!/^\d+$/.test(d.w) || parseInt(d.w, 10) < 1 || parseInt(d.w, 10) > 100) { setRouletteError(rowNo + '出やすさは1〜100の整数で入力してください。'); return; }
      items.push([parseInt(d.p, 10), parseInt(d.w, 10)]);
    }
    if (items.length < FG_MIN_ITEMS || items.length > FG_MAX_ITEMS) { setRouletteError('項目は' + FG_MIN_ITEMS + '〜' + FG_MAX_ITEMS + '個で設定してください。'); return; }
    var isDefault = items.length === FG_ROULETTE_DEFAULT.length && items.every(function (it, k) {
      return it[0] === FG_ROULETTE_DEFAULT[k].percent && it[1] === FG_ROULETTE_DEFAULT[k].weight;
    });

    commit();
  };

  window.startFinalGachaMachine = function () {

    render();

    render();
  };

  };

  window.openShare = function () { ui.shareOpen = true; render(); };

  window.copyShareLink = function () {

    function ok() { showToast('証文をお写し取りいたしました。'); }
    function fail() {
      var el = document.getElementById('share-url-input');
      if (el) { el.focus(); el.select(); }

    }

      navigator.clipboard.writeText(url).then(ok, function () {

    } else {

  };

  // Reset throws away the whole event — and since the event only lives in the URL, there

  function renderHome() {

    return '' +
      '<div class="wrap">' +
        '<div class="appbar"><div class="brand"><span class="brand-mark"><span></span><span></span></span><span class="brand-name">闇ワリカ</span></div></div>' +
        '<div class="container">' +
          '<div style="display:flex;flex-direction:column;gap:6px;padding:6px 2px 0">' +
            '<h1 style="font-size:22px;color:oklch(93% 0.1 86);-webkit-text-stroke:0.3px oklch(93% 0.1 86);text-shadow:0 0 16px oklch(80% 0.14 84 / 0.45), 0 1px 2px oklch(0% 0 0 / 0.6)">さあ、清算の刻でございます。</h1>' +
            '<p class="lede">面倒なご登録は不要でございます。証文（リンク）を一枚お回しいただくだけで、皆様はすぐにテーブルにお揃いになります。</p>' +

  function renderEvent() {
    var total = totalSpent(state);
    var body = ui.tab === 'pay' ? renderPayTab() : renderSettleTab();
    return '' +
      '<div class="wrap">' +
        '<div class="appbar">' +
